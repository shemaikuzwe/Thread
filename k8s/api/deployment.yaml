apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: app
  labels:
    app: api-gateway


spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: shemaelie/thread_api:latest
          ports: 
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: api-gateway-secretsv3
            - secretRef:
                name: database-urlv2
            - secretRef:
                name: redis-urlv1
          startupProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            failureThreshold: 90
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 8000
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
