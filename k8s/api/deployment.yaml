apiVersion: apps/v1
kind: Deployment
metadata:
  name: api_gateway
  namespace: app
  labels:
    app: api_gateway


spec:
  replicas: 2
  selector:
    matchLabels:
      app: api_gateway
  template:
    metadata:
      labels:
        app: api_gateway
    spec:
      containers:
        - name: api_gateway
          image: api_gateway
          ports: 
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api_gateway-configv1
            - secretKeyRef:
                name: api_gateway-secretsv1
                       
          startupProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 8000
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limit:
              cpu: 500m
              memory: 256Mi
