apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: app
  name: ws-server
  # for services
  labels:
    app: ws-server

spec:
  replicas: 2
  selector:
    #for pods
    matchLabels:
      app: ws-server
  template:
    metadata:
      labels:
        app: ws-server
    spec:
      containers:
        - name: ws-server
          image: shemaelie/thread_ws-server:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ws-server-configv3
              
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
