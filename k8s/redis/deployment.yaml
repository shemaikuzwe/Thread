apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: app
  labels:
    app: redis


spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine 
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --appendonly
            - "yes"  
          volumeMounts:
             - name: redis-storage
               mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 20 
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc

        


  