apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: app
  labels:
    app: web


spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: shemaelie/thread_web:latest
          ports: 
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: web-configv1

          startupProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 3000
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 3000
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
