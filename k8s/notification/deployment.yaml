apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: app
  labels:
    app: notification-service


spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: shemaelie/thread_notification-service:latest
          ports: 
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: notification-service-configv3
            - secretRef:
                name: notification-service-secretsv1
            - secretRef:
                name: database-urlv2
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
