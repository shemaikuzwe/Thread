apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: app
  labels:
    app: chat-service


spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: shemaelie/thread_chat-service:latest
          ports: 
            - containerPort: 8000
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: chat-service-configv3
                
            - secretRef:
                name: database-url
                    
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
