apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: app
  labels:
    app: chat-service


spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: chat-service
          ports: 
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: chat-service-configv1
          env: 
            - name: DATABASE_URL
            - value:
                valueFrom:
                  - secretKeyRef:
                      name: chat-service_db
                       
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limit:
              cpu: 500m
              memory: 256Mi
